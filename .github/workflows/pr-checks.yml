name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: ""
      FORMSPREE_FORM_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate route types
        run: npx --no-install next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --maxWorkers=4
      - name: Build
        run: npm run build
      - name: Renter smoke
        run: npm run smoke -- --role=renter
      - name: Landlord smoke
        run: npm run smoke -- --role=landlord
